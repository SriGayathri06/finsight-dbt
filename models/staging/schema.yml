version: 2

models:
  - name: stg_transactions
    description: "Cleaned and deduplicated banking transactions"
    columns:
      - name: transaction_id
        description: "Unique transaction identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers"
        tests:
          - not_null
      - name: merchant_id
        description: "Foreign key to stg_merchants"
        tests:
          - not_null
      - name: amount
        description: "Transaction amount in USD"
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customer records"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address"
        tests:
          - unique
          - not_null

  - name: stg_merchants
    description: "Cleaned merchant reference data"
    columns:
      - name: merchant_id
        description: "Unique merchant identifier"
        tests:
          - unique
          - not_null